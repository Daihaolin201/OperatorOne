name: CI

# Trigger on pushes to main and all PRs targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

# ─────────────────────────────────────────────────────────────────────────────
# Job: lint
# ESLint across apps/ and packages/.
# Placeholder until T8 scaffolds the actual monorepo apps.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (if lockfile exists)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "lint: TODO — pnpm workspace not yet bootstrapped (placeholder until T8)"
          fi

      - name: Run ESLint
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm ls --filter='*' 2>/dev/null | grep -q eslint; then
            pnpm turbo run lint --affected
          else
            echo "lint: TODO — ESLint not yet configured (placeholder until T8)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Job: typecheck
# tsc --noEmit on all TypeScript packages and apps.
# Placeholder until T8 scaffolds the actual monorepo apps.
# ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (if lockfile exists)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "typecheck: TODO — pnpm workspace not yet bootstrapped (placeholder until T8)"
          fi

      - name: Run tsc --noEmit
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm ls --filter='*' 2>/dev/null | grep -q typescript; then
            pnpm turbo run typecheck --affected
          else
            echo "typecheck: TODO — TypeScript not yet configured (placeholder until T8)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Job: test
# Vitest unit + integration tests for all apps and packages.
# Placeholder until T9 adds Vitest configuration.
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (if lockfile exists)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "test: TODO — pnpm workspace not yet bootstrapped (placeholder until T9)"
          fi

      - name: Run Vitest
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm ls --filter='*' 2>/dev/null | grep -q vitest; then
            pnpm turbo run test --affected
          else
            echo "test: TODO — Vitest not yet configured (placeholder until T9)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Job: contracts
# Validates all inter-agent JSON handoff contracts.
# This job is ACTIVE NOW — python3 scripts/validate_handoffs.py exits 0 on
# a clean repo.
# ─────────────────────────────────────────────────────────────────────────────
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate handoff contracts
        run: |
          python3 scripts/validate_handoffs.py --repo-root .

# ─────────────────────────────────────────────────────────────────────────────
# Job: hygiene
# Documents the change-hygiene pre-commit gate in CI context.
# The hygiene guard is primarily a PRE-COMMIT tool (run via git hook or
# scripts/ci-local.sh). In CI (on PRs) it runs against the diff between
# the PR branch and the base branch.
# ─────────────────────────────────────────────────────────────────────────────
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful on PRs where there is a base branch to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run change hygiene guard
        run: |
          python3 scripts/change_hygiene_guard.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --allow-mixed
        # Note: --allow-mixed is set here because CI sees the full PR diff,
        # which may legitimately contain both source and generated artifacts
        # when a feature adds both code and updated contracts. The strict
        # "no mixed commits" check is enforced at the pre-commit stage.
        # Remove --allow-mixed to enforce strict separation at PR level too.
