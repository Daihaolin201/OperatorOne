name: change-hygiene

on:
  pull_request:
  push:
    branches: [main, Bennett]

jobs:
  guard-mixed-generated-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run change hygiene guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          python3 scripts/change_hygiene_guard.py \
            --repo-root . \
            --base "$BASE_SHA" \
            --head "${{ github.sha }}"
