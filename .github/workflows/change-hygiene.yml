name: change-hygiene

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main, Bennett]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: change-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-mixed-generated-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run change hygiene guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            # PRs are strict: source + generated changes must be split.
            python3 scripts/change_hygiene_guard.py \
              --repo-root . \
              --base "$BASE_SHA" \
              --head "${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            # Branch pushes (e.g. Bennett snapshot pushes) are informational only.
            python3 scripts/change_hygiene_guard.py \
              --repo-root . \
              --base "$BASE_SHA" \
              --head "${{ github.sha }}" \
              --allow-mixed
          fi
