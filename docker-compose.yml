# OperatorOne — Dev Infrastructure Only
# Apps (portal, product) are started via: pnpm dev
# This compose file handles only backing services (DB, cache, etc.)

services:
  postgres:
    image: postgres:17-alpine
    container_name: op1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: op1
      POSTGRES_PASSWORD: op1dev
      POSTGRES_DB: op1_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U op1 -d op1_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: op1-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: op1-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  postgres-data:
  redis-data:

# Usage:
#   docker compose up -d           # start backing services
#   pnpm dev                        # start apps via Turborepo
#   pnpm dev:portal                 # portal only (port 3000)
#   pnpm dev:product                # product only (port 3001)
